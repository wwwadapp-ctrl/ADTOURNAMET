name: Build User Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Keystore (Auto Alias Finder)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -di > release.jks
            PASS="${KEYSTORE_PASSWORD:-${STORE_PASSWORD:-$KEY_PASSWORD}}"
            
            # Key Alias auto detect kora
            DETECTED_ALIAS=$(keytool -list -v -keystore release.jks -storepass "$PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | awk -F': ' '{print $2}' | tr -d '[:space:]')
            ACTUAL_ALIAS="${KEY_ALIAS:-${DETECTED_ALIAS:-upload}}"
            echo "Signing User App with Key Alias: '$ACTUAL_ALIAS'"

            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" ! -name "*unaligned*" | head -n 1)
            
            mkdir -p app/build/outputs/apk/release/
            $BUILD_TOOLS_DIR/apksigner sign --ks release.jks \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$PASS" \
              --key-pass "pass:${KEY_PASSWORD:-$PASS}" \
              --out app/build/outputs/apk/release/ADTournament-User-release.apk "$APK_FILE"
            echo "User Release APK signed successfully!"
          else
            echo "KEYSTORE_BASE64 not found, skipping custom signing."
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ADTournament-User-Release-APK
          path: app/build/outputs/apk/**/*.apk
